# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: "Knowledge Graph for Education Global"
site_description: "Documentation for the curriculum-document-to-knowledge-graph pipeline"
site_url: https://idinsight.github.io/SenegalKG/
repo_url: https://github.com/IDinsight/SenegalKG
use_directory_urls: false
copyright: "© 2026 IDinsight"
extra:
  analytics:
    provider: google
    property: G-K07FFTMFTN
  generator: false
  social:
    - icon: material/shield-lock
      link: https://www.idinsight.org/about/privacy-policy/
      name: Privacy Policy

nav:
  - Home:
      - "": index.md
      - Architecture: architecture.md

  - Pipeline:
      - Overview: pipeline/index.md
      - Page IR Extraction: pipeline/page-ir-extraction.md
      - Page IR Verification: pipeline/page-ir-verification.md
      - Document IR: pipeline/document-ir.md
      - Academic Standards: pipeline/academic-standards.md
      - Learning Components: pipeline/learning-components.md

  - Development:
      - development/index.md
      - Local setup: development/local-setup.md

  - Contribute:
      - ./contributing.md

  - Contact us:
      - Team: contact_us.md

# Themes and extensions
theme:
  name: material
  custom_dir: docs/overrides
  favicon: images/favicon.png
  font:
    text: "Inter"
    code: "Roboto Mono"
  palette:
    - scheme: slate # Palette toggle for dark mode
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default # Palette toggle for light mode
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.annotate
    - content.code.copy
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top

  icon:
    admonition:
      note: material/alert-circle
    annotation: material/help-circle
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      title: On this page

plugins:
  - glightbox
  - open-in-new-tab
  - search
  - blog:
      archive_date_format: MMMM yyyy
      authors: true
      authors_file: blog/.authors.yml
      blog_dir: blog
      blog_toc: true
      post_date_format: full
      post_excerpt: required
      post_excerpt_max_authors: 3
