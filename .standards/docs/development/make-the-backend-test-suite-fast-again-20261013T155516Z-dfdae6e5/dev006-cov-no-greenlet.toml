# DEV-006 measurement only: backend/pyproject.toml coverage settings without greenlet.

[tool.coverage.paths]
kgfeg = ["backend/src", "src"]

[tool.coverage.report]
exclude_lines = [
    'if __name__ == "__main__"',
    "if __name__ == '__main__'",
    "def cli",
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
omit = ["./src/kgfeg/__init__.py"]

[tool.coverage.run]
branch = true
concurrency = ["thread"]
omit = ["*/tests/*", "*/__init__.py"]
source = ["kgfeg"]
