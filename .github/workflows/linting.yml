name: Linting and Format Checks
on:
  workflow_dispatch:

  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/linting.yaml"
      - "**.py"

  push:
    branches: ["main"]
    paths:
      - ".github/workflows/linting.yaml"
      - "**.py"

env:
  CHAT_ENV: testing
  LEARNING_COMMONS_EXPORT_SCHEMA_VERSION: "2026-07-09"
  LOGGING_LEVEL: DEBUG
  OPENAI_API_KEY: sk-fake  # pragma: allowlist secret

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Define what is "backend" changes.
          filters: |
            backend:
              - "**.py"

  backend-lint-and-format-checks:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      # All run steps execute from backend directory.
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install uv and point it at backend directory so it finds the right pyproject.toml.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest
          working-directory: backend

      # Install the pinned tool versions.
      - name: Sync dev dependencies
        run: uv sync --extra dev

      # Run linters and formatters.
      - name: isort
        run: uv run isort --check --diff src/ tests/

      - name: black
        run: uv run black --check src/ tests/

      - name: ruff
        run: |
          uv run ruff check src/
          uv run ruff check tests/

      - name: interrogate
        run: uv run interrogate -v src/ tests/

      - name: mypy
        run: |
          uv run mypy src/ --explicit-package-bases --ignore-missing-imports --show-error-codes
          uv run mypy tests/ --explicit-package-bases --ignore-missing-imports --show-error-codes

      - name: pylint
        run: |
          uv run pylint src/
          uv run pylint tests/
