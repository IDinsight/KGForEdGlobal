## Document profile for Zambia's literacy and language curriculum for grades 1-3.
# This profile focuses on extracting standards and competencies from the syllabus
# tables, which are organized by grade and language skill (Listening and Speaking,
# Reading, Writing).
#
# Zambia’s spine is something like:
#
# Framework
#   -> Grade
#     -> Component/Strand: Listening and Speaking, Reading, Writing
#       -> Topic
#         -> Sub-topic
#           -> Specific Competence
#
# Using this profile, the KG builder should create:
#
# StandardsFramework
#   hasChild → Lower Primary / Grade groupings
#     hasChild → Grade 1 / Grade 2 / Grade 3
#       hasChild → Listening and Speaking / Reading / Writing
#         hasChild → Topic, e.g. 1.1 CONVERSATION
#           hasChild → Sub-topic, e.g. 1.1.1 Greetings
#             hasChild → Specific Competence, e.g. 1.1.1.1 Use appropriate greetings...
#
# Then:
#
# LearningComponent
#   supports → Specific Competence SFI
#
# And later, conservative progression edges can use grade order, topic/sub-topic
# family, code hierarchy, and document order as evidence. The pipeline plan names
# Zambia progression evidence as grade order plus topic/sub-topic plus specific
# competence code hierarchy.
#
# NB: For fields without comments, see Ghana's `document_profile_math.yml` for their
# explanations.

## Framework metadata fields

adoption_status: Adopted
attribution_statement: Content derived from Zambia Ministry of Education, Literacy and Language, English Language Lower Primary Syllabus for Grades 1-3.
author: Ministry of Education, Republic of Zambia
country: Zambia
framework_title: 'Literacy and Language: English Language Lower Primary Syllabus (Grades 1-3)'
grades_or_stages:
- Lower Primary
- Grade 1
- Grade 2
- Grade 3
jurisdiction: Zambia
languages:
- en
license: Unknown; source curriculum issued by the Ministry of Education, Republic of Zambia.
primary_language: en
provider: IDinsight
subject: English Language

## Code-handling fields
# NB: These regexes are good for identifying code shapes, but candidate extraction must
# still check column role and anchor position. A 1.1.1.1 code in the Specific
# Competences column is an SFI anchor; the same pattern appearing inside prose or a
# footer should not create an SFI.

code_parent_rules:

# Purpose: Parent rule: 1.1.1.1 -> 1.1.1.
# Uses:
#   1. Creates `Sub-topic hasChild Specific Competence`.
- child: specific_competence_code
  parent: subtopic_code
  method: drop_last_dot_component

# Purpose: Parent rule: 1.1.1 -> 1.1.
# Uses:
#   1. Creates `Topic hasChild Sub-topic`.
- child: subtopic_code
  parent: topic_code
  method: drop_last_dot_component
code_patterns:
  # Purpose: Matches topic codes like 1.1, 1.2, 2.1.
  # Uses:
  #   1. Creates or identifies Topic grouping SFIs.
  topic_code: (?<![\d.])\d+\.\d+(?![\d.])

  # Purpose: Matches sub-topic codes like 1.1.1, 1.9.4, 2.1.2.
  # Uses:
  #   1. Creates or identifies Sub-topic grouping SFIs.
  subtopic_code: (?<![\d.])\d+\.\d+\.\d+(?![\d.])

  # Purpose: Matches specific competence codes like 1.1.1.1, 1.9.2.2.
  # Uses:
  #   1. Creates leaf Standard SFIs. These are the main normative expectations.
  specific_competence_code: (?<![\d.])\d+\.\d+\.\d+\.\d+(?![\d.])
code_statement_types:
  # Purpose: Source label for two-part codes.
  # Uses:
  #   1. Preserves source semantics in `statement_type`.
  topic_code: Topic

  # Purpose: Source label for three-part codes.
  # Uses:
  #   1. Preserves source semantics in `statement_type`.
  subtopic_code: Sub-topic

  # Purpose: Source label for four-part codes.
  # Uses:
  #   1. Marks the main leaf SFI type and the preferred source for `LearningComponents`.
  specific_competence_code: Specific Competence

has_stable_codes: true

## Table-selection fields

excluded_table_columns_signatures:
- s/n|competence|descriptors

# Purpose: Section-context deny-list.
# Uses:
#   1. Blocks front matter/guidance tables even if a table-like structure is detected.
excluded_table_section_patterns:
- (?i)KEY\s+COMPETENCES\s+TO\s+BE\s+DEVELOPED
- (?i)\bINTRODUCTION\b
- (?i)Suggested\s+Teaching\s+Methodology
- (?i)\bAssessment\b
- (?i)Time\s+Allocation

# Purpose: Sub-topic
# Uses:
#   1. Specific competences
target_table_columns_signatures:
- listening and speaking|||||||topic|sub-topic|specific competences|learning activities|expected standard
- reading|||||||topic|sub-topic|specific competences|learning activities|expected standard
- writing|||||||topic|sub-topic|specific competences|learning activities|expected standard
- writing||||||||topic|sub-topic|specific competences|learning activities|expected standard|
- listening and speaking||||||||topic|sub-topic|specific competences|learning activities|expected standard|

# Purpose: Section-context allow-list.
# Uses:
#   1. Helps include the right tables based on nearby headings, not just column
#     signatures.
target_table_section_patterns:
- (?i)GRADE\s+[123]\s*:\s*ENGLISH\s+LANGUAGE
- (?i)LISTENING\s+AND\s+SPEAKING
- (?i)\bREADING\b
- (?i)\bWRITING\b

## Windowing fields

# Purpose: Allows non-table block segments to enter extraction windows.
# Uses:
#   1. Useful for grade headings and component headings, but should be filtered
#     carefully.
include_block_windows: true

# Purpose: Maximum rows per table window.
# Uses:
#   1. Reasonable for Zambia because some tables span many pages and
#     row spans/fill-down matter.
max_rows_per_table_window: 15

# Purpose: Repeats two rows across adjacent windows.
# Uses:
#   1. Reduces boundary loss when a topic/subtopic/competence context spans chunk
#     boundaries.
row_overlap: 2

table_window_mode: row_chunks

## Bilingual/multilingual policy fields
bilingual_pair_policy: null

## Merge and duplicate-control fields
repeated_statement_policy: For coded Zambia syllabus items, merge candidates with the same stable statement_code and same source statement type. Merge repeated candidates caused by row-span or fill-down table layout when they refer to the same code. Do not merge distinct specific competences that have different four-part codes, even when their text is similar across grades or components.
synthetic_merge_key_fields:
- country
- subject
- grade_level
- normalized_statement_type
- statement_type
- statement_code
- hierarchy_context
- normalized_text

## LLM instruction fields
duplicate_review_instructions: 'Review possible duplicate Zambia Literacy and Language candidates conservatively. Stable official codes are primary: the same code and statement type should normally merge with combined provenance; different specific competence codes should remain distinct. Treat repeated rows created by table continuation, row spans, or fill-down as layout duplicates when the code and statement text are the same. Do not merge similar skills across Grade 1, Grade 2, and Grade 3 unless they are clearly the same source item repeated by extraction.'
learning_component_instructions: Create LearningComponents primarily from leaf Specific Competence SFIs. Use the source English text as-is. Prefer a 1-to-1 component when the competence is already atomic. Split only when one specific competence clearly contains multiple distinct language skills. Do not create LearningComponents from Topic or Sub-topic grouping nodes, Learning Activities, Expected Standard benchmarks, methodology prose, or the Key Competences table unless a later profile explicitly marks them as LC sources.
sfi_extraction_instructions: 'Extract Zambia Literacy and Language StandardsFrameworkItem candidates from the English Language lower-primary syllabus tables. Use the grade heading as grade context: Grade 1, Grade 2, or Grade 3. Treat Listening and Speaking, Reading, and Writing as component/strand grouping SFIs. In syllabus tables with columns Topic, Sub-topic, Specific Competences, Learning Activities, and Expected Standard, extract Topic and Sub-topic as Standard Grouping SFIs using their stable codes. Extract Specific Competences as the main leaf Standard SFIs and preserve the four-part statement_code. Treat Expected Standard as a descriptor or benchmark attached to the corresponding Specific Competence, not as a standalone Standard unless it is the only clear normative expectation in the row. Treat Learning Activities as guidance only, not SFIs for v0. Ignore front-matter tables such as Key Competences to be Developed for SFI extraction. Use rows_filldown for interpreting row-span context,
  but preserve raw row/cell text and provenance. Always retain page indices, table segment id, row order, source column, statement code, grade, component, topic, and sub-topic context.'
