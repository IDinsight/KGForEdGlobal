## Document profile for Senegal's math curriculum for grades CE1-CE2.
# The Senegal math profile has the same overall role as the Senegal reading profile,
# but the curriculum structure is a little cleaner: it has a high-level competency
# frame, domain-based planning tables, and detailed “apprentissages ponctuels” tables.
# It is still bilingual Wolof/French and no-stable-code, so the profile still leans on
# domain, CE level, palier/jéego, week, table shape, and source text instead of
# official codes.
#
# The resulting hierarchy should look roughly like this:
#
# StandardsFramework
#   -> Étape 2/CE1-CE2
#     -> Compétence de cycle
#     -> Compétence de l’étape
#     -> Domain: Activités numériques
#       -> CE1
#         -> Palier 1
#           -> planning objectives/weekly objectives
#           -> Objectif spécifique leaf SFIs
#         -> Palier 2
#         -> Palier 3
#       -> CE2
#         -> Palier 4
#         -> Palier 5
#         -> Palier 6
#     -> Domain: Activités géométriques
#     -> Domain: Activités de mesure
#     -> Domain: Résolution de problèmes
#
# Then:
#
# LearningComponent
#   supports -> leaf Standard SFI
#
# Progression candidates should mostly come from:
#   - CE1 -> CE2
#   - Palier 1 -> 2 -> 3 -> 4 -> 5 -> 6
#   - Week order
#   - Number range expansion: 0–5,000 -> 0–8,000 -> 0–10,000 -> 0–50,000 -> 0–80,000 -> 0–100,000
#   - domain continuity
#
# But `buildsTowards` should stay conservative. Some weekly rows are
# scope-and-sequence; they do not always imply prerequisite progression.
#
# NB: For fields without comments, see Ghana's `document_profile_math.yml` for their
# explanations.

