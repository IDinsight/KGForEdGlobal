author: Ministère de l’Éducation nationale, République du Sénégal
country: Senegal
framework_title: Référentiel bilingue (wolof-français), Langue et Communication, 2ème étape (CE1) — Curriculum bilingue de l’éducation de base (CBEB)
grades_or_stages:
- CE1
- 2ème étape
- Étape 2
jurisdiction: Senegal
languages:
- wo
- fr
- mul
license: Unknown; source curriculum issued by the République du Sénégal, Ministère de l’Éducation nationale.
primary_language: mul
provider: IDinsight
subject: Langue et Communication

## Code-handling fields
# NB: Senegal's reading curriculum is configured as a no-stable-code curriculum.

# Purpose: No code-derived hierarchy.
# Uses:
#   1. Parent-child edges must be built from document structure: framework -> stage ->
#     subdomain/activity -> palier/jéego/week/objective context -> leaf expectation.
code_parent_rules: []

# Purpose: No official code regexes.
# Uses:
#   1. Avoids false extraction from table numbers like `1.1.1` or `1.3.1`, which are
#     table labels, not stable standard codes.
code_patterns: {}

# Purpose: No code bucket -> statement type mapping.
# Uses:
#   1. This is correct because there are no stable statement-code categories.
code_statement_types: {}

# Purpose: Declares that official statement codes should not drive extraction or IDs.
# Uses:
#   1. Prevents the pipeline from requiring code matches during prep checks. It also
#     tells the builder to use context/text/provenance-based synthetic IDs.
has_stable_codes: false

