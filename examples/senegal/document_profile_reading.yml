## Document profile for Senegal's reading curriculum for grade CE1.
# The Senegal reading profile is more complex than Ghana/Zambia because it is
# bilingual, mostly no-code, and progression is driven by document structure,
# paliers/jéego, weeks, and repeated planning tables, not official alphanumeric
# standard codes.
#
# The resulting hierarchy should look roughly like:
#
# StandardsFramework
#   -> CE1/Étape 2
#     -> Schéma intégrateur
#       -> Compétence de cycle
#       -> Compétence de l’étape
#       -> Sous-domaine: Communication orale
#       -> Sous-domaine: Communication écrite
#     -> Activité: Expression orale
#       -> Palier/Jéego 1
#         -> Objectif d’apprentissage
#           -> Objectif spécifique
#     -> Activité: Récitation
#       -> Palier/Jéego 1
#         -> Objectif spécifique
#     -> Activité: Lecture
#       -> Palier/Jéego 1
#         -> Objectif spécifique
#     -> Production d’écrits/Outils de langue/Copie
#       -> Palier/Jéego
#         -> Objectif spécifique
#
# Then:
#
# LearningComponent
#   supports -> leaf Standard SFI
#
# Progression evidence should mostly come from:
#   - Palier/Jéego order
#   - Week/Semaine order
#   - Planning table order
#   - Activity/domain continuity
#   - Narratif -> descriptif -> injonctif progression
#
# But buildsTowards should stay conservative. Weekly repetition often means recurring
# practice, not prerequisite progression.

# NB: For fields without comments, see Ghana's `document_profile_math.yml` for their
# explanations.

