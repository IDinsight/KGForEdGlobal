- (?i)\bTABLEAU DE PLANIFICATION DES APPRENTISSAGES\b
- (?i)\bActivit[ée]s?\s*-\s*Oral\b
- (?i)\bActivit[ée]s?\s*-\s*Lecture\b
- (?i)\bComp[ée]tences Communication [ÉE]crite\b
- (?i)\bActivit[ée]s de Production d['’]?[ée]crits\b
- (?i)\bAPPRENTISSAGES PONCTUELS\b
- (?i)\bPALIER\s*[1-3]\b
- (?i)\bJ[ée]ego\s*[1-3]\b|JEEGO\s*[1-3]\b|SUMB\s*[1-3]\b

## Windowing fields

# Purpose: Allows headings and prose blocks to be included.
# Uses:
#   1. Important here because headings like `Activités - Oral - Paliers 1-3`,
#     `JEEGO 1/NIVEAU 1`, `PALIER 1`, etc. are critical hierarchy/context.
include_block_windows: true

max_rows_per_table_window: 12
row_overlap: 2
table_window_mode: row_chunks

## Bilingual/multilingual policy fields
# NB: For Senegal reading, the source repeatedly gives a Wolof statement followed by a
# French restatement, especially in the competence tables and activity tables. Treating
# them as separate nodes would inflate the KG and break the curriculum’s intended
# bilingual pairing.

# Purpose: Defines how to handle paired Wolof/French content.
# Uses:
#   1. Prevents duplicate SFIs where Wolof and French restate the same competency.
#     Keeps `in_language="mul"` and preserves original source text.
bilingual_pair_policy: Preserve Wolof/French paired statements as a single mixed-language candidate when they express the same competency or objective; do not translate for v0; keep original text and language tags.

## Merge and duplicate-control fields
# NB: Because there are no stable codes, these fields are especially important.

repeated_statement_policy: For no-code rows, merge exact or near-exact repeated Wolof/French statements only when they share the same source role, activity/domain, palier/jéego, and objective context. Do not merge recurring weekly practice items merely because wording is similar.
synthetic_merge_key_fields:
- country
- subject
- grade_level
- source_activity
- palier_or_jeego
- objective_context
- statement_type
- normalized_statement_type
- normalized_text

## LLM instruction fields

duplicate_review_instructions: Review Senegal CE1 bilingual Wolof/French candidates conservatively. Treat a Wolof paragraph followed by a French paragraph as one bilingual/mixed-language item when the French restates the Wolof. Merge duplicates caused by table row filldown or repeated headers. Keep separate candidates when they occur in different activities, paliers/jéego, weeks, or objective contexts, unless they are clearly the same curriculum item repeated for layout reasons.
learning_component_instructions: Generate LearningComponents only from final leaf expectation SFIs, especially Objectifs spécifiques / Nisaru jukki bi and clear learning objectives under Oral, Lecture, Communication écrite, Production d’écrits, Outils de langue, and Copie. Do not generate LearningComponents from durations, week numbers, integration/evaluation rows, table captions, or generic section headings. Preserve original Wolof/French wording for v0; no English translation is required.
sfi_extraction_instructions: This is a no-stable-code Senegal CE1 bilingual Wolof/French language-and-communication curriculum. Extract StandardsFrameworkItems from normative curriculum statements, not from pedagogical directions alone. Create Standard Grouping SFIs for the framework, CE1/Étape 2, subdomains/activities such as Communication orale, Lecture, Communication écrite, Production d’écrits, Outils de langue, Récitation, paliers/jéego/niveaux, and table/objective contexts when they organize leaf expectations. Create Standard SFIs for Compétence de cycle, Compétence de l’étape, Compétences de sous-domaines, Compétences de base, Objectif d’apprentissage / Nisaru njàng, and Objectifs spécifiques / Nisaru jukki bi when they state what learners are expected to integrate, understand, produce, read, copy, or demonstrate. Treat Contenus / Këmb / Limu ëmb, Outils de langue / Jumtukaayi làkk details, Durée / Diir, week labels, INTÉGRATION, and EVALUATION rows as metadata, descriptors, guidance,
  or sequencing evidence unless the row itself contains a clear normative objective. Use rows_filldown for interpreting implied palier/week/objective context, but cite raw rows/cells for source fidelity. Do not create a new SFI just because a filldown value repeats across multiple rows. When a cell contains Wolof followed by French conveying the same item, keep them together as one mixed-language candidate with in_language='mul'.
