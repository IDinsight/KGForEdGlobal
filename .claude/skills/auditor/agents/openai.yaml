# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $auditor to establish or refresh the project context baseline for the active workflow cycle. Inspect relevant repository evidence and upstream workflow artifacts, write `.standards/CONTEXT.md`, avoid making scope, architecture, implementation, testing, review, documentation, or synchronization decisions, then follow the protocol for the correct forward or recovery handoff."
  display_name: "Auditor"
  short_description: "Establish the evidence-based project context baseline."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
