# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $scoper to define or revise the scope for this project or change. Capture goals, boundaries, constraints, non-goals, scope-level acceptance conditions, dependencies, and coarse work items. Do not make new architecture or implementation decisions. Resolve blocking scope questions. On normal completion hand off to Architect; during recovery follow the protocol's recovery-stack and invalidation rules."
  display_name: "Scoper"
  short_description: "Define bounded scope before architecture and implementation."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
