repos:
# Generic file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0  # Use the revision sha / tag you want to point at
  hooks:
    - id: check-yaml
      args: [ "--unsafe" ]
    - id: end-of-file-fixer
    - id: trailing-whitespace

# Detect secrets
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(frontend/pnpm-lock\.yaml|\.template\.env$)'

# Local hooks (scripts + Python linters/formatters).
#
# NB: All Python linters use `language: system` so they run from the project venv
# (backend/.venv) and share the exact same tool versions as CI. Versions are pinned
# once in backend/pyproject.toml---no more drift between pre-commit and CI.
#
# NB: We use `uv run --project backend` to execute tools using the backend environment
# while keeping the execution root at the repo root so file paths align.
- repo: local
  hooks:
    # Global
    - id: env-template-sync
      name: Ensure .template.env and .env matches each other
      entry: uv run --project python scripts/tools/check_env_template.py
      language: system
      pass_filenames: false

    # Backend
    - id: black
      name: black
      entry: uv run --project backend black
      language: system
      types: [python]
      files: ^backend/(src|tests)/.*\.py$

    - id: isort
      name: isort
      entry: uv run --project backend isort
      language: system
      types: [python]
      files: ^backend/(src|tests)/.*\.py$

    - id: ruff
      name: ruff
      entry: uv run --project backend ruff check --fix --exit-non-zero-on-fix
      language: system
      types: [python]
      files: ^backend/(src|tests)/.*\.py$

    - id: interrogate
      name: interrogate
      entry: uv run --project backend interrogate -v
      language: system
      types: [python]
      files: ^backend/(src|tests)/.*\.py$
      exclude: (^|/)__init__\.py$

    - id: mypy
      name: mypy
      entry: uv run --project backend mypy --explicit-package-bases --ignore-missing-imports --show-error-codes
      language: system
      types: [python]
      files: ^backend/(src|tests)/.*\.py$

    - id: pylint
      name: pylint
      entry: uv run --project backend pylint --rcfile=backend/.pylintrc
      language: system
      types: [python]
      files: ^backend/(src|tests)/.*\.py$

    # Frontend
    - id: prettier
      name: prettier
      entry: pnpm --dir=frontend exec prettier --write "src/**/*.{js,ts,jsx,tsx,mjs,cjs}"
      language: system
      pass_filenames: false
      files: ^frontend/src/.*\.(js|ts|jsx|tsx|mjs|cjs)$

    - id: eslint
      name: eslint
      entry: pnpm --dir=frontend exec eslint --config eslint.config.mjs --fix --format stylish --no-error-on-unmatched-pattern "src/**/*.{js,ts,jsx,tsx,mjs,cjs}"
      language: system
      pass_filenames: false
      files: ^frontend/src/.*\.(js|ts|jsx|tsx|mjs|cjs)$

    - id: typecheck
      name: tsc --noEmit
      entry: pnpm --dir=frontend exec tsc --noEmit
      language: system
      pass_filenames: false
      files: ^frontend/(src/.*\.(ts|tsx|mts|cts)|package\.json|pnpm-lock\.yaml|tsconfig\.json)$
