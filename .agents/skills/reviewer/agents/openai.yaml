# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $reviewer in an independent session under the protocol to assess the active work while REVIEWING_IMPLEMENTATION or REVIEWING_FINAL. Select the kind from persisted state, inspect relevant claims and evidence independently, persist the cycle-owned report, and follow ownership, completion, recovery, and plain-language summary rules."
  display_name: "Reviewer"
  short_description: "Independently assess work and actionable findings."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
