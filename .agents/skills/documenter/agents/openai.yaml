# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $documenter for a standalone brownfield documentation assignment or active DOCUMENTING work, preserving the Auditor-first entry route, saved choices, checked evidence, and protocol ownership and recovery rules."
  display_name: "Documenter"
  short_description: "Document current behavior with resumable evidence."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
