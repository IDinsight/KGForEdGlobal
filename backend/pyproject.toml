# BUILD SYSTEM CONFIGS #
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
include = ["kgfeg*"]
where = ["src"]

# TOOLS #

# black
[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
setup.py
'''
include = '\.pyi?$'
line-length = 88

# interrogate
[tool.interrogate]
badge-format = "svg"
color = true
exclude = ["*/__init__.py"]
ext = []
generate-badge = "../"  # Output file location
ignore-magic = false
ignore-init-method = false
ignore-init-module = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-classes = false
ignore-nested-functions = false
ignore-overloaded-functions = false
ignore-semiprivate = false
ignore-setters = false
ignore-regex = ["__init__.py*", "^mock_.*"]
fail-under = 100
omit-covered-files = false
quiet = false
verbose = 0  # Possible values: 0 (minimal output), 1 (-v), 2 (-vv)
whitelist-regex = []

# isort
[tool.isort]
atomic = true
filter_files = true
import_heading_firstparty = "Package Library"
import_heading_future = "Future Library"
import_heading_localfolder = "Local Folder"
import_heading_stdlib = "Standard Library"
import_heading_thirdparty = "Third Party Library"
include_trailing_comma = true
known_first_party = "kgfeg"
known_third_party = "git, mpi4py, ntpath, numpy, pexpect, pytest, sphinx_rtd_theme, yaml"
line_length = 88
lines_between_types = 1
multi_line_output = 3
profile = "black"

# mypy
[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
bdd_features_base_dir = "tests/features/"
markers = ["costs-money"]
pythonpath = [".", "src"]
testpaths = ["tests"]

# pytest coverage
[tool.coverage.paths]
kgfeg = ["backend/src", "src"]

[tool.coverage.report]
exclude_lines = [
    'if __name__ == "__main__"',
    "if __name__ == '__main__'",
    "def cli",
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
omit = ["./src/kgfeg/__init__.py"]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["*/tests/*", "*/__init__.py"]
source = ["kgfeg"]

# ruff
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint.mccabe]
max-complexity = 10

# PROJECT METADATA #
